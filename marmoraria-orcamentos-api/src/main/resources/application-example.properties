spring.application.name=marmoraria-orcamentos-api
server.port=8090
spring.datasource.url=jdbc:postgresql://localhost:5432/marmoraria_orcamentos
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Comma-separated list of allowed frontend origins. Set CORS_ALLOWED_ORIGINS in production.
# Example: CORS_ALLOWED_ORIGINS=https://meusite.com.br
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
