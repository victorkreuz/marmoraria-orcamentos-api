# =============================================================
# TEMPLATE PARA DESENVOLVIMENTO LOCAL
# Copie este arquivo para: application.properties
# Preencha os valores e NUNCA commite o application.properties
# =============================================================

spring.application.name=marmoraria-orcamentos-api
server.port=8090

# --- Banco de dados local ---
spring.datasource.url=jdbc:postgresql://localhost:5432/marmoraria_orcamentos
spring.datasource.username=postgres
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Cloudinary (conta de desenvolvimento) ---
cloudinary.cloud-name=SEU_CLOUD_NAME
cloudinary.api-key=SUA_API_KEY
cloudinary.api-secret=SEU_API_SECRET

# --- JWT (minimo 32 chars — gere com: openssl rand -base64 48) ---
jwt.secret=GERE_UM_SECRET_AQUI_COM_PELO_MENOS_32_CARACTERES

# --- CORS (localhost para dev) ---
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173

# --- Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- Swagger (habilitado localmente) ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# --- Logs ---
logging.level.root=INFO
logging.level.com.marmoraria=DEBUG
