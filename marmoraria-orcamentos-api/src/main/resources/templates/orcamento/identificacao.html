<section id="page-client" class="[[SECTION_CLASS]]">

    <section id="client-info" class="pdf-module module-client-info no-break">
        <div class="section-header">
            <h2 class="section-title">Dados do Cliente</h2>
        </div>

        <div class="client-grid">
            <div class="info-block">
                <span class="info-block__label">Cliente / Razão Social</span>
                <span class="info-block__value">[[NOME_CLIENTE]]</span>
            </div>
            [[CAMPOS_CLIENTE_EXTRAS]]
        </div>
    </section>

    <section id="proposal-info" class="pdf-module module-with-divider no-break">
        <div class="section-header">
            <h2 class="section-title">Dados do Orçamento</h2>
        </div>

        <div class="client-grid client-grid--3col">
            <div class="info-block">
                <span class="info-block__label">Número</span>
                <span class="info-block__value">[[NUMERO_ORCAMENTO]]</span>
            </div>

            <div class="info-block">
                <span class="info-block__label">Emissão</span>
                <span class="info-block__value">[[DATA_EMISSAO]]</span>
            </div>

            <div class="info-block">
                <span class="info-block__label">Vencimento</span>
                <span class="info-block__value">[[DATA_VENCIMENTO]]</span>
            </div>
        </div>
    </section>

    [[SECAO_PROJETO_TEXTO]]
    [[SECAO_PROJETO_IMAGENS]]

</section>
