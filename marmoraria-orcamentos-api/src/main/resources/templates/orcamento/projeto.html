<section id="project-summary" class="pdf-module module-project-summary module-with-divider no-break">
    <div class="section-header">
        <h2 class="section-title">Dados do Projeto</h2>
    </div>

    <div class="client-grid client-grid--3col">
        <div class="info-block">
            <span class="info-block__label">Nome do Projeto</span>
            <span class="info-block__value">[[NOME_PROJETO]]</span>
        </div>

        <div class="info-block">
            <span class="info-block__label">Material / Ambiente</span>
            <span class="info-block__value">[[AMBIENTE_PROJETO]]</span>
        </div>

        <div class="info-block">
            <span class="info-block__label">Responsável Técnico</span>
            <span class="info-block__value">[[RESPONSAVEL_TECNICO]]</span>
        </div>
    </div>

    <div class="info-block info-block--full">
        <span class="info-block__label">Observações do Projeto</span>
        <span class="info-block__value text-preserve-lines">[[OBSERVACOES_PROJETO]]</span>
    </div>
</section>

<section id="gallery-images" class="pdf-module module-gallery module-with-divider">
    <div class="section-header">
        <h2 class="section-title">Visualização do Projeto</h2>
    </div>

    <div class="gallery-grid">
        [[IMAGENS_PROJETO]]
    </div>
</section>
