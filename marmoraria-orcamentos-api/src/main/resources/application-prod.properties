# =============================================================
# PERFIL DE PRODUCAO — Railway
# Ative com: SPRING_PROFILES_ACTIVE=prod  (variavel no Railway)
# =============================================================

# --- Servidor ---
# Railway injeta PORT automaticamente
server.port=${PORT:8080}

# --- Banco de dados ---
# Railway PostgreSQL plugin injeta PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automaticamente
spring.datasource.url=jdbc:postgresql://acela.proxy.rlwy.net:31449/railway
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# NUNCA usar "update" em producao — usa validate (Flyway gerencia o schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Cloudinary ---
# Defina no painel do Railway: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# --- JWT ---
# Gere com: openssl rand -base64 48
# Defina no painel do Railway: JWT_SECRET
jwt.secret=${JWT_SECRET}

# --- CORS ---
# Defina no painel do Railway: CORS_ALLOWED_ORIGINS=https://seu-app.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- Logs ---
logging.level.root=WARN
logging.level.com.marmoraria=INFO

# --- Swagger (desabilitado em producao) ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Actuator (so /health exposto) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Temp dir (Railway usa filesystem efemero) ---
server.tomcat.basedir=${java.io.tmpdir}/tomcat
